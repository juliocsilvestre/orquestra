<!doctype html>
<html lang="pt-BR">
<head>

<title>Orquestra</title>
<style>
  :root {

<body>
<header>
  <h1>Orquestra <span></span></h1>
  <div class="tabs" id="rooms" title="Salas (projetos)"></div>

<main>
  <div id="office"><div id="empty">Nenhum Boss rodando no Herdr. Rode <code>../bin/boss.sh</code> num terminal do Herdr.</div><div id="flow"></div><div id="srvPanel"></div><div id="toasts"></div><div id="feed"></div>
    <div id="screen"><div class="bar"><b id="scrTitle"></b><span class="vt"><button data-vt="chat" class="on">Conversa</button><button data-vt="tela">Tela</button><button data-vt="sess">Sessões</button><button data-vt="skills">Skills</button><button data-vt="instr">Instruções</button></span><span class="note">ao vivo</span><button id="scrClose">fechar</button></div><div id="scrChat"></div><pre id="scrText" style="display:none">…</pre><div id="scrSess" style="display:none"></div><div id="scrSkills" style="display:none"></div><div id="scrInstr" style="display:none"></div><div id="scrQuote" style="display:none"></div><div id="scrCompose"><select id="scrVia"></select><textarea id="scrMsg" rows="2" placeholder="Escreva… (⌘+Enter envia)"></textarea><button id="scrSend">Enviar</button></div></div>
  </div>

    </div>

<div id="boot"><div class="spin"></div><b id="bootStep">abrindo…</b><small id="bootSub"></small></div>
<div id="bootErr"><b>O Orquestra não conseguiu abrir esta tela</b><pre id="bootMsg"></pre><div><button onclick="location.reload()">Recarregar</button> <button onclick="location.href='/'">Ir para o prédio</button></div></div>
<script>
  // nunca ficar com a tela escura: ao voltar do cache do navegador, reacende
  addEventListener('pageshow', () => { document.body.style.opacity = ''; });
  // carregamento por etapas, com o tempo de cada uma (ajuda a achar o que demora)
  const T0 = performance.now(); window.__tempos = [];
  window.bootStep = (t) => { window.__tempos.push([t, Math.round(performance.now() - T0)]); const el = document.getElementById('bootStep'); if (el) el.textContent = t; };
  window.bootDone = async () => {
    const total = Math.round(performance.now() - T0); window.__tempos.push(['pronto', total]);
    const b = document.getElementById('boot'); if (b) b.style.display = 'none';
    console.log('[Orquestra] carregamento (ms):', window.__tempos.map(([t, ms]) => `${t} ${ms}`).join(' · '));
    if (total > 5000) { try { const h = await fetch('/health').then((r) => r.json()); const p = h.perf || {}; console.log('[Orquestra] servidor:', p);
      const motivo = (p.firstScanMs == null) ? 'o servidor acabou de subir e ainda está lendo o histórico das sessões' : (p.scanUsageMax > 1500 || p.scanAcctMax > 1500) ? 'o servidor estava lendo o histórico das sessões' : (p.pollHcMax > 1500) ? 'o Herdr demorou a responder' : 'a página demorou a montar a cena 3D';
      window.__lento = `carregou em ${(total / 1000).toFixed(1)} s — ${motivo}`; } catch {} }
  };
  setTimeout(() => { const s = document.getElementById('bootSub'); if (s && document.getElementById('boot').style.display !== 'none') s.textContent = 'demorando mais que o normal — se for a 1ª vez depois de reiniciar, o servidor está lendo o histórico das sessões'; }, 4000);
  const mostraErro = (m) => { document.body.style.opacity = ''; document.getElementById('boot').style.display = 'none'; const e = document.getElementById('bootErr'); e.style.display = 'flex'; document.getElementById('bootMsg').textContent = m; };
  addEventListener('error', (e) => mostraErro((e.message || 'erro') + (e.filename ? '\n' + e.filename.split('/').pop() + ':' + e.lineno : '')));
  addEventListener('unhandledrejection', (e) => mostraErro(String(e.reason && (e.reason.stack || e.reason.message) || e.reason)));
</script>
<script type="module">
  const p = new URLSearchParams(location.search).get('p');
  import(p ? './app.js' : './predio.js')
    .then(() => { if (!window.__esperaInit) window.bootDone(); })
    .catch((e) => mostraErro(String(e && (e.stack || e.message) || e)));
</script>
