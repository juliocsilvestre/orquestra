name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            cmd: npx electron-builder --mac dmg zip --arm64 --x64 --publish never
          - os: ubuntu-latest
            cmd: npx electron-builder --linux AppImage deb --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # sem certificado da Apple por enquanto
      - uses: actions/upload-artifact@v4
        with:
          name: orquestra-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
